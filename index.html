<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtreme'x TV - Mobile Optimized</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/videojs-playlist-ui@4.0.0/dist/videojs-playlist-ui.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden; /* পুরো পেজের স্ক্রল বন্ধ */
            display: flex;
            flex-direction: column;
        }

        /* প্লেয়ারের অংশ - এটি উপরে আটকে থাকবে */
        .player-side {
            width: 100%;
            background: #000;
            flex-shrink: 0; /* ছোট হবে না */
        }
        .video-js { width: 100% !important; aspect-ratio: 16 / 9; }

        /* চ্যানেলের নাম */
        #channel-name-display {
            padding: 10px;
            background: #111;
            color: #0071e3;
            text-align: center;
            font-weight: bold;
        }

        /* প্লেলিস্টের অংশ - শুধু এইটুকু স্ক্রল হবে */
        .playlist-side {
            flex: 1; /* বাকি জায়গা দখল করবে */
            overflow-y: auto !important; /* স্ক্রল কাজ করার জন্য */
            background: #1a1a1a;
            -webkit-overflow-scrolling: touch; /* মোবাইলে স্মুথ স্ক্রল */
        }

        .playlist-side::-webkit-scrollbar { width: 6px; }
        .playlist-side::-webkit-scrollbar-thumb { background: #0071e3; border-radius: 3px; }

        .vjs-playlist .vjs-playlist-item { border-bottom: 1px solid #333 !important; }
        .vjs-playlist .vjs-selected { background: rgba(0, 113, 227, 0.3) !important; }
    </style>
</head>
<body>

    <div class="player-side">
        <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay muted playsinline preload="auto"></video>
        <div id="channel-name-display">Loading...</div>
    </div>

    <div class="playlist-side">
        <div id="vjs-playlist"></div>
    </div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-playlist@5.1.0/dist/videojs-playlist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-playlist-ui@4.0.0/dist/videojs-playlist-ui.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const player = videojs('video-player', { fluid: true, autoplay: true, muted: true });
        const nameDisplay = document.getElementById('channel-name-display');

        const channels = [
            { name: 'LIVE SPORTS', sources: [{ src: 'http://10.253.253.244:8088/101/video.m3u8?token=jFxqNJYCS6lG30', type: 'application/x-mpegURL' }], poster: 'img/logo.png' },
            { name: 'T-SPORTS', sources: [{ src: 'http://10.253.253.244:8088/102/video.m3u8?token=jFxqNJYCS6lG30', type: 'application/x-mpegURL' }], poster: 'img/logo.png' },
            { name: 'Fox Sports', sources: [{ src: 'https://d1jzu95oc8fgt3.cloudfront.net/FOX_Sports1080p.m3u8', type: 'application/x-mpegURL' }], poster: 'img/logo.png' },
            { name: 'Channel 2', sources: [{ src: 'https://s2.bufaloweb.com/bufalo9/tracks-v4a1/mono.ts.m3u8', type: 'application/x-mpegURL' }], poster: 'img/logo.png' },
            { name: 'Local Stream', sources: [{ src: 'http://172.16.200.211/stream/hls/ch01.m3u8', type: 'application/x-mpegURL' }], poster: 'img/logo.png' },
            { name: 'Colors HD', sources: [{ src: 'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/ColorsHD/default/ColorsHD-video=2137600.m3u8', type: 'application/x-mpegURL' }], poster: 'img/logo.png' },
            { name: 'Somoy TV', sources: [{ src: 'https://live.thebosstv.com:30443/dwlive/Somoy-TV/chunks.m3u8', type: 'application/x-mpegURL' }], poster: 'img/logo.png' }
        ];

        player.playlist(channels);
        player.playlistUi({ el: document.getElementById('vjs-playlist') });

        player.on('playlistitem', () => {
            const currentItem = player.playlist.currentItem();
            nameDisplay.innerText = channels[currentItem].name;
        });

        let bufferTimeout;
        player.on('waiting', () => {
            bufferTimeout = setTimeout(() => player.playlist.next(), 10000);
        });
        player.on('playing', () => clearTimeout(bufferTimeout));
        player.on('error', () => player.playlist.next());

        document.body.addEventListener('click', () => {
            if(player.muted()) player.muted(false);
        }, { once: true });
    });
</script>
</body>
</html>
