<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtreme'x TV - FIFA Final</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/videojs-playlist-ui@4.0.0/dist/videojs-playlist-ui.css" rel="stylesheet">

    <style>
        :root { --stadium-dark: #0a1f11; --gold: #d4af37; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/img2.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .app-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); border-bottom: 3px solid var(--gold); }
        .header-title { font-size: 1.5rem; font-weight: bold; color: var(--gold); text-transform: uppercase; }
        .date-time { font-size: 0.9rem; color: #fff; text-align: right; }

        /* Scrolling Notice Section */
        .marquee-container { background: var(--gold); color: #000; padding: 8px 0; overflow: hidden; white-space: nowrap; font-weight: bold; }
        .marquee-container marquee { font-size: 1rem; }

        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        .player-side { flex: 3; display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }
        .video-js { width: 100% !important; flex: 1; }
        
        #channel-info-bar { 
            padding: 12px; background: rgba(0,0,0,0.9); color: var(--gold); 
            text-align: center; font-weight: bold; border-top: 1px solid var(--gold); 
        }
        
        .playlist-side { flex: 1; width: 350px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 10px; }
        
        .vjs-playlist .vjs-playlist-item-list { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vjs-playlist .vjs-playlist-item { 
            background: rgba(0,0,0,0.6) !important; 
            border: 1px solid var(--gold) !important; 
            border-radius: 8px !important; 
            display: flex; flex-direction: column; align-items: center; padding: 8px !important; 
        }
        
        .vjs-playlist-thumbnail { width: 50px !important; height: 50px !important; margin-bottom: 5px; }
        
        @media (max-width: 768px) { .main-wrapper { flex-direction: column; } .playlist-side { width: 100%; height: 35vh; } }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">XTREME'X TV - FIFA FINAL</div>
        <div class="date-time" id="date-time"></div>
    </div>

    <!-- Scrolling Notice -->
    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="5">
            সতর্কবার্তা: সার্ভারে অতিরিক্ত লোড থাকার কারণে খেলা দেখতে কিছুটা বাফার হতে পারে। যদি কোনো চ্যানেল বাফার করে, তবে অনুগ্রহ করে অন্য চ্যানেলগুলো ট্রাই করুন। আমাদের সাথে থাকার জন্য ধন্যবাদ!
        </marquee>
    </div>
    
    <div class="main-wrapper">
        <div class="player-side">
            <video id="video-player" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay muted playsinline preload="auto"></video>
            <div id="channel-info-bar">
                <span id="channel-name-display">SELECT CHANNEL</span>
            </div>
        </div>
        <div class="playlist-side">
            <div id="vjs-playlist"></div>
        </div>
    </div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-playlist@5.1.0/dist/videojs-playlist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-playlist-ui@4.0.0/dist/videojs-playlist-ui.min.js"></script>

<script>
    // Date and Time
    function updateDateTime() {
        const now = new Date();
        document.getElementById('date-time').innerText = now.toLocaleString('en-GB', { hour12: true });
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    document.addEventListener('DOMContentLoaded', () => {
        const player = videojs('video-player', { fluid: false, autoplay: true, muted: true });
        const nameDisplay = document.getElementById('channel-name-display');
        const logoUrl = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFGA22yHZPfB4GU5ThMKZt9mKRCbDN7P3hEZsq0YnnrA&s';

        const channels = [
            { name: 'FIFA 2', sources: [{ src: 'http://10.253.253.244:8088/101/video.m3u8?token=jFxqNJYCS6lG30', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 3', sources: [{ src: 'http://10.253.253.244:8088/102/video.m3u8?token=jFxqNJYCS6lG30', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 4', sources: [{ src: 'https://d1jzu95oc8fgt3.cloudfront.net/FOX_Sports1080p.m3u8', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 5', sources: [{ src: 'https://s2.bufaloweb.com/bufalo9/tracks-v4a1/mono.ts.m3u8', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 6', sources: [{ src: 'https://pull.niues.live/live/stream-9912060_lhd.m3u8?auth_key=1783366763-0-0-e738badfeb59ab0c20ae4a350ec0d4ea', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 7', sources: [{ src: 'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/ColorsHD/default/ColorsHD-video=2137600.m3u8', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 8', sources: [{ src: 'https://live.thebosstv.com:30443/dwlive/Somoy-TV/chunks.m3u8', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 9', sources: [{ src: 'https://cp11.adabmedia.com/hls2/sport.m3u8', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 10', sources: [{ src: 'https://andro.evrenesoglu57.click/checklist/batutest.m3u8', type: 'application/x-mpegURL' }], poster: logoUrl },
            { name: 'FIFA 1', sources: [{ src: 'https://d952e52961615b5576267090ed78c739.livehwc4.com/pullsgp.yyzb456.top/live/stream-896956_lhd.m3u8?sub_m3u8=true&edge_slice=true&user_session_id=ae15f0c1673d28ef8e8158cf7eb04e9a', type: 'application/x-mpegURL' }], poster: logoUrl }
        ];

        player.playlist(channels);
        player.playlistUi({ el: document.getElementById('vjs-playlist') });

        player.on('playlistitem', () => {
            const currentItem = player.playlist.currentItem();
            nameDisplay.innerText = channels[currentItem].name;
        });

        document.body.addEventListener('click', () => {
            if(player.muted()) player.muted(false);
        }, { once: true });
    });
</script>
</body>
</html>
